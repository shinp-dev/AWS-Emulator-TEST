<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">学生管理サイトの AWS Emulator 構成図</title>
  <desc id="desc">ブラウザーからローカル Node.js サーバーにリクエストし、AWS SDK for JavaScript v3 を経由して AWS Emulator 上の Amazon DynamoDB Students テーブルを操作する構成です。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 9 4.5 0 9Z" fill="#7662d9"/>
    </marker>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="145%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#27314b" flood-opacity=".08"/>
    </filter>
  </defs>
  <rect width="1200" height="600" rx="20" fill="#f5f7fb"/>
  <text x="48" y="55" fill="#20233a" font-family="'Noto Sans JP', sans-serif" font-size="25" font-weight="700">学生管理サイトの AWS 構成</text>
  <text x="49" y="83" fill="#777d93" font-family="'Noto Sans JP', sans-serif" font-size="13">画面の CRUD 操作はローカルの Node.js API を通って、AWS Emulator の DynamoDB API に届きます。</text>

  <rect x="36" y="112" width="1128" height="322" rx="18" fill="#fff" stroke="#e7eaf2"/>
  <rect x="54" y="127" width="235" height="26" rx="13" fill="#f1efff"/>
  <circle cx="69" cy="140" r="4" fill="#7662d9"/>
  <text x="81" y="144" fill="#6652c2" font-family="'Noto Sans JP', sans-serif" font-size="11" font-weight="700">ローカル開発環境 · localhost</text>

  <g filter="url(#shadow)">
    <rect x="62" y="194" width="175" height="176" rx="14" fill="#fff" stroke="#e6e8f0"/>
    <rect x="62" y="194" width="175" height="8" rx="4" fill="#7b68df"/>
  </g>
  <circle cx="149" cy="242" r="24" fill="#f1efff"/>
  <rect x="132" y="232" width="34" height="24" rx="3" fill="none" stroke="#7662d9" stroke-width="1.7"/>
  <path d="M132 239h34M145 256v5m8-5v5m-12 0h16" fill="none" stroke="#7662d9" stroke-width="1.7" stroke-linecap="round"/>
  <text x="149" y="294" text-anchor="middle" fill="#282b42" font-family="'Noto Sans JP', sans-serif" font-size="15" font-weight="700">ブラウザー</text>
  <text x="149" y="318" text-anchor="middle" fill="#85899c" font-family="'Noto Sans JP', sans-serif" font-size="11">学生一覧・検索</text>
  <text x="149" y="339" text-anchor="middle" fill="#85899c" font-family="'Noto Sans JP', sans-serif" font-size="11">追加・編集・削除</text>

  <line x1="244" y1="282" x2="306" y2="282" stroke="#7662d9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="275" y="263" text-anchor="middle" fill="#797d93" font-family="'Noto Sans JP', sans-serif" font-size="10">HTTP</text>

  <g filter="url(#shadow)">
    <rect x="315" y="194" width="190" height="176" rx="14" fill="#fff" stroke="#e6e8f0"/>
    <rect x="315" y="194" width="190" height="8" rx="4" fill="#3876bc"/>
  </g>
  <circle cx="410" cy="242" r="24" fill="#edf4ff"/>
  <path d="M399 235h22m-22 7h22m-22 7h14" fill="none" stroke="#477fc2" stroke-width="2" stroke-linecap="round"/>
  <circle cx="395" cy="235" r="1.5" fill="#477fc2"/><circle cx="395" cy="242" r="1.5" fill="#477fc2"/><circle cx="395" cy="249" r="1.5" fill="#477fc2"/>
  <text x="410" y="294" text-anchor="middle" fill="#282b42" font-family="'Noto Sans JP', sans-serif" font-size="15" font-weight="700">Node.js API</text>
  <text x="410" y="318" text-anchor="middle" fill="#85899c" font-family="'Noto Sans JP', sans-serif" font-size="11">server.js · port 4173</text>
  <text x="410" y="339" text-anchor="middle" fill="#85899c" font-family="'Noto Sans JP', sans-serif" font-size="11">/api/students</text>

  <line x1="512" y1="282" x2="567" y2="282" stroke="#7662d9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="539" y="263" text-anchor="middle" fill="#797d93" font-family="'Noto Sans JP', sans-serif" font-size="10">AWS SDK</text>

  <g filter="url(#shadow)">
    <rect x="576" y="194" width="188" height="176" rx="14" fill="#fff" stroke="#e6e8f0"/>
    <rect x="576" y="194" width="188" height="8" rx="4" fill="#d18b38"/>
  </g>
  <circle cx="670" cy="242" r="24" fill="#fff4e5"/>
  <path d="M658 234h24v17h-24zM663 230v8m14-8v8m-12 3h14m-14 4h9" fill="none" stroke="#bd7b2c" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="670" y="294" text-anchor="middle" fill="#282b42" font-family="'Noto Sans JP', sans-serif" font-size="14" font-weight="700">AWS SDK for JS v3</text>
  <text x="670" y="318" text-anchor="middle" fill="#85899c" font-family="'Noto Sans JP', sans-serif" font-size="11">SigV4 署名</text>
  <text x="670" y="339" text-anchor="middle" fill="#85899c" font-family="'Noto Sans JP', sans-serif" font-size="11">Emulator CA 証明書</text>

  <line x1="771" y1="282" x2="816" y2="282" stroke="#7662d9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="792" y="263" text-anchor="middle" fill="#797d93" font-family="'Noto Sans JP', sans-serif" font-size="10">HTTPS</text>

  <rect x="827" y="166" width="318" height="239" rx="15" fill="#fbfcff" stroke="#8a78e3" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="845" y="151" width="195" height="29" rx="14" fill="#7662d9"/>
  <text x="942" y="170" text-anchor="middle" fill="#fff" font-family="'Noto Sans JP', sans-serif" font-size="11" font-weight="700">AWS Emulator · Docker</text>
  <text x="986" y="198" text-anchor="middle" fill="#777d93" font-family="'Noto Sans JP', sans-serif" font-size="10">https://127.0.0.1:9297</text>

  <rect x="850" y="220" width="120" height="143" rx="12" fill="#f2efff" stroke="#e5defe"/>
  <circle cx="910" cy="256" r="20" fill="#fff"/>
  <path d="M901 250c0-4 18-4 18 0s-18 4-18 0Zm0 0v12c0 4 18 4 18 0v-12m-18 6c0 4 18 4 18 0" fill="none" stroke="#7662d9" stroke-width="1.5"/>
  <text x="910" y="301" text-anchor="middle" fill="#332b5e" font-family="'Noto Sans JP', sans-serif" font-size="13" font-weight="700">DynamoDB API</text>
  <text x="910" y="323" text-anchor="middle" fill="#77718f" font-family="'Noto Sans JP', sans-serif" font-size="10">ローカル実行</text>
  <text x="910" y="343" text-anchor="middle" fill="#77718f" font-family="'Noto Sans JP', sans-serif" font-size="10">メモリー上のデータ</text>

  <line x1="976" y1="291" x2="996" y2="291" stroke="#7662d9" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1003" y="220" width="120" height="143" rx="12" fill="#fff" stroke="#dfe4ec"/>
  <circle cx="1063" cy="256" r="20" fill="#eaf6f0"/>
  <ellipse cx="1063" cy="249" rx="10" ry="4" fill="none" stroke="#329773" stroke-width="1.6"/>
  <path d="M1053 249v13c0 5 20 5 20 0v-13m-20 6c0 5 20 5 20 0" fill="none" stroke="#329773" stroke-width="1.6"/>
  <text x="1063" y="301" text-anchor="middle" fill="#282b42" font-family="'Noto Sans JP', sans-serif" font-size="13" font-weight="700">Students</text>
  <text x="1063" y="323" text-anchor="middle" fill="#85899c" font-family="'Noto Sans JP', sans-serif" font-size="10">テーブル</text>
  <text x="1063" y="343" text-anchor="middle" fill="#85899c" font-family="'Noto Sans JP', sans-serif" font-size="10">PK: id (String)</text>

  <text x="50" y="471" fill="#555970" font-family="'Noto Sans JP', sans-serif" font-size="12" font-weight="700">画面操作が呼ぶ DynamoDB API</text>
  <g font-family="'Noto Sans JP', sans-serif" font-size="11" font-weight="600">
    <rect x="50" y="490" width="195" height="48" rx="10" fill="#edf4ff"/><text x="68" y="519" fill="#3b6eaa">一覧取得</text><text x="225" y="519" text-anchor="end" fill="#547da9">Scan</text>
    <rect x="258" y="490" width="195" height="48" rx="10" fill="#eaf7f1"/><text x="276" y="519" fill="#368c6d">学生追加</text><text x="433" y="519" text-anchor="end" fill="#368c6d">PutItem</text>
    <rect x="466" y="490" width="224" height="48" rx="10" fill="#fff5e8"/><text x="484" y="519" fill="#a36b2b">学生編集</text><text x="670" y="519" text-anchor="end" fill="#a36b2b">GetItem + PutItem</text>
    <rect x="703" y="490" width="195" height="48" rx="10" fill="#fff0ee"/><text x="721" y="519" fill="#b65e55">学生削除</text><text x="878" y="519" text-anchor="end" fill="#b65e55">DeleteItem</text>
    <rect x="911" y="490" width="234" height="48" rx="10" fill="#f0f1f6"/><text x="929" y="519" fill="#62667a">起動時のテーブル確認</text><text x="1127" y="519" text-anchor="end" fill="#62667a">DescribeTable</text>
  </g>
  <text x="50" y="574" fill="#8a8da0" font-family="'Noto Sans JP', sans-serif" font-size="10">注: Emulator を停止するとメモリー上のテーブルとレコードは消えます。実 AWS には接続しません。</text>
</svg>
